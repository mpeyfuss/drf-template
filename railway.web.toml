"$schema" = "https://railway.com/railway.schema.json"

[deploy]
preDeployCommand = ["python manage.py migrate --noinput"]
startCommand = "python manage.py collectstatic --noinput && exec gunicorn config.wsgi --bind 0.0.0.0:${PORT:-8000} --worker-class gevent --workers ${WEB_CONCURRENCY:-2} --worker-connections ${WEB_WORKER_CONNECTIONS:-100} --access-logfile - --error-logfile - --capture-output"
healthcheckPath = "/health"
