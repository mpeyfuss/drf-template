[project]
name = "drf-template"
version = "0.1.0"
description = "A production-oriented Django REST Framework JSON API starter for Railway"
readme = "README.md"
license = { text = "MIT" }
authors = []
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery==5.6.3",
  "django==6.0.7",
  "django-anymail[mailgun]==15.0",
  "django-celery-results==2.6.0",
  "django-cors-headers==4.9.0",
  "django-environ==0.14.0",
  "django-http-compression==1.4.0",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "djangorestframework==3.17.1",
  "drf-orjson-renderer==1.8.0",
  "drf-spectacular==0.30.0",
  "drf-standardized-errors[openapi]==0.16.0",
  "gevent==26.5.0",
  "gunicorn==26.0.0",
  "hiredis==3.4.0",
  "psycopg[binary,pool]==3.3.4",
  "redis==8.0.1",
  "sentry-sdk==2.66.0",
  "whitenoise[brotli]==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.15.2",
  "django-migration-linter==6.0.0",
  "django-stubs[compatible-mypy]==6.0.7",
  "django-upgrade==1.31.1",
  "djangorestframework-stubs==3.17.0",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.0",
  "pre-commit==4.6.1",
  "pytest==9.1.1",
  "pytest-django==4.12.0",
  "pytest-recording==0.13.4",
  "pytest-sugar==1.1.1",
  "ruff==0.15.22",
  "watchfiles==1.2.0",
]

[tool.uv]
exclude-newer = "7 days"

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812", # conflicts with the formatter
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]
testpaths = [ "tests" ]

[tool.coverage]
run.omit = [ "*/migrations/*" ]
# ==== Coverage ====
run.source = [ "apps", "config" ]
report.show_missing = true
